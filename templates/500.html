<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 — Server Error | Samyak</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'DM Sans',sans-serif;background:#0A0A1A;color:#F0F0FF;
             min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;}
        .num{font-family:'Syne',sans-serif;font-size:120px;font-weight:800;
             background:linear-gradient(135deg,#FF4C6A,#FF6B35);
             -webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;}
        h2{font-family:'Syne',sans-serif;font-size:24px;margin:16px 0 10px;}
        p{color:#9090B8;font-size:15px;margin-bottom:32px;}
        a{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;
          background:linear-gradient(135deg,#6C3CE1,#8B5CF6);color:white;
          text-decoration:none;border-radius:12px;font-weight:600;font-size:14px;}
    </style>
</head>
<body>
    <div>
        <div class="num">500</div>
        <h2>Server Error</h2>
        <p>Something went wrong on our end. Please try again in a moment.</p>
        <a href="/">← Back to Home</a>
    </div>
</body>
</html>
